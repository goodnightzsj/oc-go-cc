name: Beta Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Version is derived by .github/scripts/get-versions.sh inside the pipeline.
  pipeline:
    name: Beta
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-pipeline.yml
    with:
      channel: beta
    secrets: inherit
