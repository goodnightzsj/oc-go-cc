name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # "1.25" follows the patch releases. `go-version-file: go.mod` resolved
          # go.mod's "go 1.25.0" to that exact patch, so CI validated a
          # toolchain the release never used - and that build carries reachable
          # standard-library vulnerabilities fixed in later 1.25.x patches.
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify compiled CSS
        run: |
          npm ci
          make check-css

      - name: Check formatting
        run: bash scripts/check-go-format.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race

      - name: Verify delivery failure handling
        run: node scripts/delivery.test.mjs --dist

      - name: Verify native WorkBuddy updater
        run: WB2A_TEST_PORTABLE=0 bash ops/workbuddy/update.test.sh

      - name: Build
        run: go build ./cmd/routatic-proxy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # "1.25" follows the patch releases. `go-version-file: go.mod` resolved
          # go.mod's "go 1.25.0" to that exact patch, so CI validated a
          # toolchain the release never used - and that build carries reachable
          # standard-library vulnerabilities fixed in later 1.25.x patches.
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: a new linter release adds checks, which would fail this job
          # on an unchanged tree. Bump deliberately and fix what it reports.
          version: v2.13.2
          args: --timeout 5m
